<!doctype html>
<html><body>
  <form id="pay-form">
    <label for="number">Card number</label><input id="number" name="cardnumber" autocomplete="cc-number">
    <label for="m">Expiry month</label>
    <select id="m" name="exp_month" autocomplete="cc-exp-month">
      <option value="">Month</option>
      <option value="0">January</option><option value="1">February</option><option value="2">March</option><option value="3">April</option>
      <option value="4">May</option><option value="5">June</option><option value="6">July</option><option value="7">August</option>
      <option value="8">September</option><option value="9">October</option><option value="10">November</option><option value="11">December</option>
    </select>
    <select id="y" name="exp_year" autocomplete="cc-exp-year">
      <option value="">Year</option>
      <option>2030</option><option>2031</option><option>2032</option><option>2033</option><option>2034</option><option>2035</option>
    </select>
  </form>
</body></html>
