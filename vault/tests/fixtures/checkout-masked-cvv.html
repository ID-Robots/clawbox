<!doctype html>
<html><body>
  <form id="pay" action="/pay" method="post">
    <input type="email" id="email" name="email" autocomplete="email">
    <input id="cc" name="cardnumber" autocomplete="cc-number" inputmode="numeric">
    <input type="password" id="cvc" name="cvc" autocomplete="cc-csc">
    <input type="password" id="sec" name="security_code">
    <button type="submit">Pay</button>
  </form>
</body></html>
