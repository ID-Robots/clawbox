name: tmp data-dir probe

# Temporary: measures how `next build` treats a box's data/ folder. Removed
# before the pull request is opened.
on:
  push:
    branches: [clawbox/run-i8w073l8]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        layout: [workspace, box]
        fixture: [symlinks, clean]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.10"
      - run: bun install --frozen-lockfile
      - name: Pick the build directory
        run: |
          if [ "${{ matrix.layout }}" = box ]; then
            sudo mkdir -p /home/clawbox/clawbox
            sudo mount --bind "$GITHUB_WORKSPACE" /home/clawbox/clawbox
            echo "DIR=/home/clawbox/clawbox" >> "$GITHUB_ENV"
          else
            echo "DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - name: Plant runtime data
        working-directory: ${{ env.DIR }}
        run: |
          mkdir -p data/coding-agent-streams data/coding-agent-artifacts/run-probe000 data/webapps/demo
          echo '{}' > data/config.json
          printf 'x\n' > data/coding-agent-streams/run-probe000.err
          printf 'x\n' > data/coding-agent-streams/run-probe000.out
          printf 'png' > data/coding-agent-artifacts/run-probe000/shot-001.png
          printf '<p>hi</p>' > data/webapps/demo/index.html
          if [ "${{ matrix.fixture }}" = symlinks ]; then
            mkdir -p data/coding-agent-artifacts/run-probe000/venv-attempt/venv/bin
            ln -s /nonexistent/python3.12 data/coding-agent-artifacts/run-probe000/venv-attempt/venv/bin/python
          fi
          find data -maxdepth 6 -printf '%y %p -> %l\n'
      - name: Build
        working-directory: ${{ env.DIR }}
        run: |
          set +e
          bun run build > build.log 2>&1
          echo "BUILD_RC=$?" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: What the build said
        if: always()
        working-directory: ${{ env.DIR }}
        run: |
          grep -n -i -E "symlink|TurbopackInternal|very dynamic|overly broad|unexpected file|ENOENT|Build error|Caused by|\[project\]" build.log | head -80 || true
          echo "----- tail"
          tail -40 build.log
      - name: What the traces hold from data/
        if: always()
        working-directory: ${{ env.DIR }}
        run: |
          [ -d .next/server ] || { echo "no .next/server"; exit 0; }
          node -e '
            const fs = require("fs"), path = require("path");
            const root = process.cwd();
            const out = [];
            const walk = (d) => { for (const e of fs.readdirSync(d, { withFileTypes: true })) {
              const p = path.join(d, e.name);
              if (e.isDirectory()) walk(p); else if (e.name.endsWith(".nft.json")) out.push(p);
            } };
            walk(path.join(root, ".next"));
            const rows = [];
            for (const f of out) {
              let files = [];
              try { files = JSON.parse(fs.readFileSync(f, "utf8")).files || []; } catch { continue; }
              const abs = files.map((x) => path.resolve(path.dirname(f), x));
              const rel = abs.map((a) => path.relative(root, a));
              const data = rel.filter((r) => r === "data" || r.startsWith("data/"));
              const git = rel.filter((r) => r.startsWith(".git/")).length;
              const docs = rel.filter((r) => r.startsWith("docs-site/") || r.startsWith("e2e/") || r.startsWith("bench/")).length;
              if (data.length || git || docs) rows.push({ f: path.relative(root, f), total: files.length, data: data.length, git, sweep: docs, sample: data.slice(0, 8) });
            }
            rows.sort((a, b) => b.data - a.data || b.sweep - a.sweep);
            console.log(`${out.length} nft files; ${rows.length} touch data/.git/sweep`);
            for (const r of rows.slice(0, 40)) console.log(JSON.stringify(r));
          '
          echo "----- standalone/data"
          find .next/standalone/data -maxdepth 4 2>/dev/null | head -40 || true
