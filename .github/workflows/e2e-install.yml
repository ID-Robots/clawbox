name: E2E Install

# Full-install harness — boots a real systemd container, runs install.sh,
# exercises every setup-api happy path, and verifies the in-app updater +
# reboot flow. Much heavier than the mock-backed `E2E Tests` workflow.
# Triggers:
#   - nightly (scheduled)
#   - on-demand via `workflow_dispatch`
#   - every PR (open / synchronize / reopen) — runs against PRs targeting
#     any branch (no `branches:` filter on the trigger). The previous
#     opt-in `run-full-e2e` label gate was removed so every PR gets full
#     install + updater coverage before it merges.
#
# Shards (TASK-1127; e2e-install/shards.ts is the one definition). One runner
# ran everything in ~16 min, most of it the in-app upgrade's two rebuilds on a
# box that had already run every other spec. Each shard is its own runner, its
# own container and its own real install, side by side:
#   - `core`: every spec but the upgrade — install.sh, the wizard, every app,
#     the reboot. Every run, every PR.
#   - `upgrade`: the wizard, then main → this head through the in-app updater.
#     Every scheduled and dispatched run, and every PR that touches a path the
#     upgrade depends on (`UPGRADE_PATHS`) — or whose file list cannot be read.
# The `plan` job decides, and the `e2e-install` check — the one branch
# protection requires — is the `verdict` job, green only when every shard the
# plan asked for passed.
#
# Runner choice:
#   - Prefers `ubuntu-24.04-arm` for ~5-10 min runs (native arm64).
#   - Falls back to `ubuntu-latest` + qemu-user-static for repos/plans
#     without arm64 runners; expect ~30-40 min in that case.
#   Set `E2E_INSTALL_ARM64_RUNNER` repo variable to `false` to force x86.

on:
  workflow_dispatch:
    inputs:
      upgrade_target_branch:
        description: "Branch to exercise the in-app updater against"
        required: false
        default: "beta"
      grep_filter:
        description: "Optional playwright --grep pattern to narrow the suite"
        required: false
        default: ""
  schedule:
    # 03:17 UTC nightly — staggered from the top of the hour to dodge
    # runner queue spikes.
    - cron: "17 3 * * *"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: e2e-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    # Which shards this run needs, as a JSON array for the matrix below.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The PR's changed-file list comes from the API; nothing is written.
      pull-requests: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      # The same tree the shards check out, so the plan and the Playwright
      # config read one definition of the shards. Only e2e-install/ is needed.
      - name: Checkout PR head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          sparse-checkout: e2e-install
          persist-credentials: false

      - name: Checkout repository
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          sparse-checkout: e2e-install
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.10"

      # Every way of not knowing the changed files runs every shard: a
      # schedule or dispatch has no PR, the API can fail, and it lists at most
      # 3000 files — so a list shorter than the PR's own `changed_files` is
      # treated as unknown rather than as complete. A rename counts under both
      # names: moving a file out of a gated path changes the gated path.
      - name: Plan the shards
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          plan() { bun e2e-install/plan-shards.ts "$@"; }
          if [ "$EVENT" != "pull_request" ]; then
            shards=$(plan --all)
          elif ! gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | [.filename, .previous_filename // empty] | @tsv' > "$RUNNER_TEMP/changed.tsv"; then
            echo "::warning::could not list this PR's files — running every shard"
            shards=$(plan --all)
          elif [ "$(wc -l < "$RUNNER_TEMP/changed.tsv")" -ne "${CHANGED_FILES:--1}" ]; then
            echo "::warning::the API listed $(wc -l < "$RUNNER_TEMP/changed.tsv") of this PR's $CHANGED_FILES files — running every shard"
            shards=$(plan --all)
          else
            shards=$(tr '\t' '\n' < "$RUNNER_TEMP/changed.tsv" | plan)
          fi
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "e2e-install shards: \`$shards\`" >> "$GITHUB_STEP_SUMMARY"

  e2e-install:
    name: e2e-install (${{ matrix.shard }})
    needs: plan
    strategy:
      # Every shard runs to the end: each is its own box, and a failure in one
      # says nothing about the other.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    # Prefer the native arm64 runner; fall back to x86 when the repo
    # variable `E2E_INSTALL_ARM64_RUNNER` is set to the string `false`.
    runs-on: ${{ vars.E2E_INSTALL_ARM64_RUNNER == 'false' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    # Budget: on native arm64 `core` finishes in ~7 min and `upgrade` in ~13;
    # qemu is several times that; give headroom for docker pulls on cold
    # runners.
    timeout-minutes: 90
    # Where the secrets live. ONE job on purpose: a scheduled/manual job of
    # its own would repeat the fifteen steps below, and a caller job that
    # `uses:` a reusable workflow cannot set an Environment (only the called
    # workflow's own jobs can, and on a pull_request the PR head supplies that
    # file too) — so the one job names its Environment by event instead. A pull_request run
    # references `e2e-pull-request`, which holds no secrets and needs no
    # protection (the job checks out and runs the PR head's own config and
    # specs; see "Write .env.test" below). Every other run — the schedule, a
    # dispatch — references `e2e-credentials`, whose deployment-branch policy
    # (beta and main only) is what fences the secrets: a run from any other
    # ref is refused before a step starts, whatever this file says, because
    # on a pull_request the PR head supplies this file too. The owner
    # configures both under Settings → Environments: create
    # `e2e-pull-request` empty; create `e2e-credentials`, put the provider
    # keys and TELEGRAM_BOT_TOKEN in it, restrict its deployment branches to
    # beta and main, then DELETE the repository-level copies — with those
    # still there, a same-repo PR that edits the step-level `if:` below reads
    # them anyway, and that `if:` is hygiene, not the fence.
    environment: ${{ github.event_name == 'pull_request' && 'e2e-pull-request' || 'e2e-credentials' }}
    env:
      CLAWBOX_PORT: "8080"
      # Default target for the in-app updater test. On PRs targeted at this
      # harness itself (before it lands on beta/main), use the PR head ref
      # so `git reset --hard origin/<target>` lands on the same fixes that
      # made install.sh work under CLAWBOX_TEST_MODE. After the PR merges
      # to beta, switch the default back to 'beta'.
      CLAWBOX_UPGRADE_TARGET_BRANCH: >-
        ${{ inputs.upgrade_target_branch
            || (github.event_name == 'pull_request' && github.head_ref)
            || 'beta' }}
      # Which specs this box runs (playwright.config.ts → shards.ts).
      CLAWBOX_E2E_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout PR head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          # The updater fetches its target branch explicitly. Keeping only the
          # exact PR head avoids copying the repository's full object history
          # into the Docker image while preserving a real, fetchable .git repo.
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout repository
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Scheduled/dispatch runs update the checked-out branch. The updater
          # performs its own `git fetch origin <branch>`, and version checks use
          # `git ls-remote --tags`, so local history and tags are unnecessary.
          fetch-depth: 1
          persist-credentials: false

      - name: Show Docker + runner info
        run: |
          echo "runner: ${{ runner.name }} (${{ runner.os }} / ${{ runner.arch }})"
          docker version
          docker compose version
          uname -a

      - name: Register qemu-user-static for arm64 (x86 runner only)
        if: runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # Real AI-provider credentials are injected via repo secrets. The test
      # steps that need them skip gracefully when the file is absent, so
      # forks without secrets still get meaningful coverage. Values are
      # passed through env vars and written via printf so a secret that
      # happens to contain the EOF token or other heredoc-breaking bytes
      # can't truncate the resulting .env file.
      #
      # Never on a pull_request run: this job checks out the PR HEAD and then
      # runs its playwright.config.ts, global-setup.ts and specs on the host
      # with this file beside them, so a same-repo PR branch could read the
      # file and send it anywhere. A same-repo PR now behaves exactly like a
      # fork PR; the credentialed specs run on the schedule and on dispatch.
      # (A gate in this file is only hygiene — the PR head supplies the
      # workflow too — which is why these secrets also belong in a GitHub
      # Environment restricted to beta/main, not at repository scope.)
      # Nothing reads CLAWBOX_UPGRADE_TARGET_BRANCH from the file — the
      # updater spec reads process.env, set by the job-level env above — so
      # the whole step is skipped rather than split.
      - name: Write .env.test
        if: ${{ github.event_name != 'pull_request' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAWBOX_AI_API_KEY: ${{ secrets.CLAWBOX_AI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          UPGRADE_BRANCH: ${{ env.CLAWBOX_UPGRADE_TARGET_BRANCH }}
        run: |
          : > e2e-install/.env.test
          for key in ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY OPENROUTER_API_KEY CLAWBOX_AI_API_KEY TELEGRAM_BOT_TOKEN; do
            # Indirect expansion — skip empty values so unset secrets don't
            # pollute the file. printf avoids shell-special interpretation
            # of the value (no backslash escapes, no heredoc pitfalls).
            value="${!key}"
            [ -n "$value" ] && printf '%s=%s\n' "$key" "$value" >> e2e-install/.env.test
          done
          printf '%s=%s\n' "CLAWBOX_UPGRADE_TARGET_BRANCH" "$UPGRADE_BRANCH" >> e2e-install/.env.test
          # Avoid echoing values back into logs; just print which ones are set.
          awk -F= '/^[A-Z]/ {printf "  %s: set\n", $1}' e2e-install/.env.test

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.10"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build e2e-install image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: e2e-install/Dockerfile
          load: true
          tags: clawbox-e2e:latest
          cache-from: type=gha,scope=e2e-install-${{ runner.arch }}
          cache-to: type=gha,mode=min,scope=e2e-install-${{ runner.arch }}

      # The install inside the container (~4 min) needs nothing from the host
      # but the image, so it starts here and runs while the host installs
      # Playwright below — 40 s to 1 min 45 s of apt, measured, that every
      # shard otherwise waited through first. global-setup's `compose up -d`
      # then finds the container running with the same config, leaves it be,
      # and waits for the install as before.
      - name: Boot the container
        run: docker compose -f e2e-install/docker-compose.test.yml up -d

      # Only install the host-side bits we need to *drive* the tests: the
      # Playwright runner + its system libs for the chat UI spec. The
      # container inside Docker has its own separate Playwright install.
      - name: Install Playwright (host side)
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Run e2e-install suite
        id: e2e
        env:
          # Never interpolate workflow_dispatch inputs directly into a
          # shell — go through env to avoid a shell-injection pattern.
          GREP_FILTER: ${{ inputs.grep_filter }}
          # Let global-setup.ts handle image build + container boot +
          # waitForInstallComplete. It already does all three with one
          # consistent error path. The image itself was built immediately
          # above from this exact checkout; content-addressed BuildKit layers
          # only avoid re-downloading unchanged base packages on cold runners.
          CLAWBOX_E2E_REBUILD: "0"
        run: |
          set -o pipefail
          args=()
          if [ -n "$GREP_FILTER" ]; then
            # Every shard gets the same grep, and it can leave one of them with
            # nothing to run (`chat` is only in core). An empty shard is not a
            # failure — without a grep it still is, since then every shard has
            # specs by definition.
            args=(--grep "$GREP_FILTER" --pass-with-no-tests)
          fi
          bunx playwright test --config e2e-install/playwright.config.ts "${args[@]}"

      - name: Dump install log on failure
        if: failure()
        run: |
          echo "── last 300 lines of /var/log/clawbox-install.log ──"
          docker compose -f e2e-install/docker-compose.test.yml exec -T clawbox \
            tail -n 300 /var/log/clawbox-install.log 2>/dev/null || true
          echo "── journalctl for clawbox-* services ──"
          docker compose -f e2e-install/docker-compose.test.yml exec -T --user root clawbox \
            journalctl --no-pager --since "-30m" -u 'clawbox-*' 2>/dev/null || true
          echo "── systemctl list-units --state=failed ──"
          docker compose -f e2e-install/docker-compose.test.yml exec -T --user root clawbox \
            systemctl list-units --state=failed --no-pager 2>/dev/null || true

      - name: Tear down container
        if: always()
        run: |
          docker compose -f e2e-install/docker-compose.test.yml down -v || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-install-report-${{ matrix.shard }}
          path: e2e-install/playwright-report/
          retention-days: 14

      - name: Upload test-results (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-install-test-results-${{ matrix.shard }}
          path: e2e-install/test-results/
          retention-days: 7

  verdict:
    # THE `e2e-install` check — the name branch protection requires. The
    # shards report as `e2e-install (<shard>)`, which no rule names, so this is
    # the one job that has to be green.
    name: e2e-install
    needs: [plan, e2e-install]
    # Never skipped: a skipped job reports success to branch protection, and
    # without a status function this `if:` would be the implicit `success()`,
    # which skips it whenever a shard failed — the one run it must go red on.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.verdict.outputs.shards }}
    steps:
      - name: Every planned shard passed
        id: verdict
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          SHARD_RESULT: ${{ needs.e2e-install.result }}
        run: |
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::the plan job finished '$PLAN_RESULT', so no shard ran"
            exit 1
          fi
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::the e2e-install shards $SHARDS finished '$SHARD_RESULT' — see the e2e-install (<shard>) jobs"
            exit 1
          fi
          echo "every planned shard passed: $SHARDS"

  comment:
    # Skip for fork PRs — GITHUB_TOKEN is always read-only there, so the
    # comment would 403. Also skip on schedule/workflow_dispatch (no PR to
    # comment on).
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && always() }}
    needs: verdict
    runs-on: ubuntu-latest
    permissions:
      # PR comments go through the issues API, but on PR resources the
      # `pull-requests: write` permission is sufficient. `issues: write` is
      # only required to comment on standalone issues (not PRs), which this
      # job never does.
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          E2E_INSTALL_RESULT: ${{ needs.verdict.result }}
          E2E_INSTALL_SHARDS: ${{ needs.verdict.outputs.shards }}
        with:
          script: |
            const marker = '<!-- clawbox-ci-summary -->';
            const sectionStart = '<!-- clawbox-ci-e2e-install:start -->';
            const sectionEnd = '<!-- clawbox-ci-e2e-install:end -->';
            const result = process.env.E2E_INSTALL_RESULT;
            // The verdict already prints `result` verbatim, so a cancelled run
            // reads "cancelled" — but the ICON said ❌, which is the same false
            // failure e2e-tests.yml carried in words: `always()` runs this job
            // during a cancellation too. Failure is now the only thing that
            // gets ❌.
            const icon = result === 'success' ? '✅'
              : result === 'skipped' ? '⏭️'
              : result === 'failure' ? '❌' : '⏹️';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Which shards ran, so a green check over `core` alone is not read
            // as the upgrade having passed. Unknown (the plan never finished)
            // prints nothing rather than a guess.
            let shards = [];
            try { shards = JSON.parse(process.env.E2E_INSTALL_SHARDS || '[]'); } catch {}
            const ran = Array.isArray(shards) && shards.length
              ? `\n- Shards: ${shards.map(s => `\`${s}\``).join(', ')}${shards.includes('upgrade') ? '' : ' — the upgrade shard runs when a PR touches a path it depends on (e2e-install/shards.ts)'}`
              : '';
            const section = `${sectionStart}\n## ${icon} E2E Install\n- Result: **${result}**${ran}\n- [View run](${runUrl})\n${sectionEnd}`;

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            const updateSection = (body, start, end, replacement) => {
              const pattern = new RegExp(`${start}[\\s\\S]*?${end}`);
              return pattern.test(body) ? body.replace(pattern, replacement) : `${body}\n\n${replacement}`;
            };

            if (existing) {
              const body = updateSection(existing.body ?? '', sectionStart, sectionEnd, section);
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              const body = `${marker}\n# CI Summary\n\n${section}`;
              await github.rest.issues.createComment({
                owner, repo, issue_number: context.issue.number, body,
              });
            }
