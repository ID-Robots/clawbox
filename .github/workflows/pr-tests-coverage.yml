name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A run a newer push to the same PR has superseded tells nobody anything the
# newer one will not, and it holds six runners while it does. Grouped by PR number,
# and every other run — a push to a branch, a schedule — in a group of its
# own (its run id): GitHub keeps one RUNNING and one PENDING run per group and
# cancels the pending one when a third arrives, whatever `cancel-in-progress`
# says, so a group keyed on the branch would queue each landed commit behind
# the last and drop the middle one of three quick pushes unverified.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# THREE jobs do the work and one of them, `test`, is the verdict. `test` is
# the REQUIRED status check on beta and main, so it is the job every other one
# here reports into:
#
#   checks  — the blocking checks that are not the suite, plus advisory lint.
#   shard   — the vitest suite, split four ways across runners (TASK-1127).
#   test    — merges the four shards' reports, applies the coverage
#             thresholds ONCE over the merged coverage, and fails unless
#             `checks` and every shard passed.
#
# The suite alone took 11-13 min of a ~15 min job on one runner and was half
# of every PR's wait; split four ways it is ~4 min a shard plus ~1 min of merge.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Ahead of the toolchain, because it needs none of it: a broken image
      # path is a `test -f` over the docs tree. It is HERE rather than in
      # docs-deploy.yml because that workflow only runs on push to main — it
      # publishes, it does not gate — so a PR that repoints an <img> at a name
      # that does not exist gets no verdict until the images are already broken
      # on github.com. Three 4.0 screenshots in the README sat that way across
      # main and beta (TASK-1023). Seconds, and its failure is a list of paths
      # to fix rather than something a reviewer has to interpret.
      - name: Doc image paths
        run: ./scripts/check-doc-images.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.10"

      - name: Install
        run: bun install --frozen-lockfile

      # Explicit, and first: the sudoers allow-list is a privilege boundary, and
      # until now this check only reached CI as a side effect of one vitest case
      # (src/tests/unit/sudoers-coverage.test.ts, which skips itself off Linux).
      # A change to the vitest config or a rename of that file would have taken
      # the guard off the build without anything saying so. It runs in seconds,
      # so it also fails fast rather than after the whole suite.
      - name: Sudoers allow-list coverage
        run: bun run check:sudoers

      - name: Existing x64 desktop integration fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/x64-migration -p 'test_*.py'

      # The i18n scan: a locale short of a key, and an English literal in
      # src/components or src/app that never reaches t()/tr(). BLOCKING, and
      # ahead of the suite for the same reason the sudoers check is — it takes
      # seconds, and its failure is a list of strings to fix rather than
      # something a reviewer has to interpret.
      #
      # It runs here AS WELL AS in vitest (src/tests/unit/i18n-scan.test.ts).
      # That is deliberate, not duplication: the test is what a developer hits
      # locally in the run they were making anyway, and this step is what keeps
      # the guard on the build if the suite is ever narrowed or the file
      # renamed — the same hole the sudoers check was pulled out of vitest to
      # close. The third question it asks — a non-English value identical to
      # the English one — is a judgement call and does NOT set the exit code;
      # it prints for a reader and is answered in scripts/i18n-allowlist.json.
      - name: i18n scan
        run: bun run scripts/i18n-scan.ts

      # The MCP server's tree is EXCLUDED from the root tsconfig (see its
      # `exclude`), so `tsc --noEmit` — wherever it runs — has never covered
      # mcp/**, and no workflow ran this project. Three errors sat on beta
      # unseen as a result, in src/lib files the MCP tree pulls in
      # transitively. Fast (one tsc over a small project) and blocking: this is
      # the only thing that typechecks the stdio process the agent talks to.
      - name: MCP typecheck
        run: bun run typecheck:mcp

      # The tool CONTRACT — name and description limits, flat schemas, and which
      # tools each edition may register. It builds the surface over five
      # postures, so it covers the families a CI runner cannot PROBE and the
      # three tools it is not inside a coding RUN for (see mcp/check-tools.ts);
      # before that it examined a third of the tools and printed OK over the
      # rest, which is why it could not be a CI job.
      - name: MCP tool contract
        run: bun run check:mcp-tools

      # ADVISORY, deliberately, and this is the decision the card asked for:
      # eslint reports 18 errors and 123 warnings on beta today, so a blocking
      # step would fail every PR on day one and be switched off again — the same
      # trap the coverage thresholds below describe. Sixteen of the eighteen are
      # `no-require-imports` in code that uses `require()` on purpose (keeping
      # Node APIs out of the Edge bundle); the other two are one `no-explicit-any`
      # and one react-hooks rule. Making the numbers VISIBLE on every PR is the
      # first step; ratcheting this to blocking, one rule at a time, is the
      # second, and it needs those eighteen dealt with first.
      #
      # The counts go to the RUN SUMMARY, not only into a collapsed step log:
      # `continue-on-error` alone makes the job green and the PR comment say
      # "Tests passed", so without this the errors exist nowhere anyone looks
      # and the ratchet has no baseline. THREE outcomes, not two — eslint prints
      # no summary line when it has nothing to report, so a clean run and a
      # crashed one would otherwise write the same "no summary line" sentence,
      # and the day the ratchet succeeds every PR would read like a broken step.
      #
      # In THIS job, beside the suite rather than after it: lint took 1-1.5 min
      # at the end of the one job that ran the suite, and the verdict waited for
      # it. Here it finishes long before the four shards do, so nobody waits on
      # it at all. `!cancelled()`, not `always()`: it still runs when a blocking
      # check above went red — the counts are most useful on exactly that run —
      # but not while the run is being cancelled.
      - name: Lint (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          rc=0
          bun run lint > lint.out 2>&1 || rc=$?
          cat lint.out
          {
            echo "### Lint (advisory — not blocking)"
            echo
            if summary=$(grep -E '[0-9]+ problems? \([0-9]+ errors?, [0-9]+ warnings?\)' lint.out); then
              echo "$summary"
            elif [ "$rc" -eq 0 ]; then
              echo "Lint clean — 0 problems."
            else
              echo "eslint produced no summary line and exited $rc — it crashed; see the step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  shard:
    name: vitest (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # The ceiling TASK-702 put on the job that runs the suite, kept on the jobs
    # that run it now. Raising the per-test ceiling for the files that start
    # real processes makes a genuine hang that much more expensive to surface,
    # and this is the backstop that keeps "a hung test must not cost a day"
    # true without weakening the 5 s default everywhere else. (A quarter of the
    # suite needs far less than 30 minutes; a hang needs exactly this much.)
    timeout-minutes: 30
    strategy:
      # Every shard runs to the end: a failure in one says nothing about the
      # other three, and the merged report is the one place all of it is read.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.10"

      - name: Install
        run: bun install --frozen-lockfile

      # `bun run test:coverage:ci` plus two things, and only these (see
      # package.json; src/tests/unit/ci-workflows.test.ts pins it): the blob
      # reporter, which writes this shard's results AND its coverage to
      # .vitest-reports/blob-<n>-<of>.json for the merge; and the coverage
      # thresholds set to zero. vitest checks thresholds on every coverage
      # report it writes, and a quarter of the suite covers a quarter of the
      # code, so a shard would fail every threshold. They are applied once,
      # to the merged coverage, in `test` below.
      #
      # vitest splits by file (a hash of each path, so the same file always
      # lands in the same shard), not by duration; measured on 1239 files, the
      # heaviest (the ~90 s sudoers scan) is well under a shard's share.
      - name: Test
        run: bun run test:coverage:shard --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # `!cancelled()`: a shard whose tests FAILED still reported, and the
      # merge is where those failures are told. Only a shard that never wrote
      # its blob has nothing to upload — and `test` refuses to merge without it.
      - name: Upload the shard's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  test:
    # The REQUIRED check, so it must never be skipped: a skipped job reports
    # success to branch protection. A job whose `if:` has no status function
    # gets the implicit `success()`, which skips it whenever a job it needs
    # failed — exactly the run it has to go red on. `!cancelled()` runs it
    # over any outcome except a cancellation (a newer push, or a person), and
    # the last step below turns every other outcome into its own verdict.
    needs: [checks, shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # Whether the SUITE itself reported, as distinct from whether the JOB
      # passed. Those are two different claims and the comment below makes both,
      # so it needs both: a shard that never reported means the suite never ran
      # whole, and a check failing BESIDE it means the job went red over a
      # green suite. Read as success / failure / anything else, where anything
      # else (skipped, cancelled, or an outcome the runner could not evaluate)
      # is "did not run" rather than a verdict invented here.
      suite: ${{ steps.suite.outcome }}
      found: ${{ steps.coverage.outputs.found }}
      statements: ${{ steps.coverage.outputs.statements }}
      branches: ${{ steps.coverage.outputs.branches }}
      functions: ${{ steps.coverage.outputs.functions }}
      lines: ${{ steps.coverage.outputs.lines }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.10"

      # The merge re-reads the config (thresholds, coverage include/exclude)
      # and the sources the coverage maps point at, so it needs the same
      # checkout and the same vitest the shards ran.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Download the shards' reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      # `--merge-reports` merges whatever it finds; a shard that never
      # uploaded is simply absent, and the merge would print a green suite and
      # a coverage figure over three quarters of it. See the script.
      - name: Every shard reported
        run: bash scripts/check-vitest-shards.sh .vitest-reports

      # The suite's verdict. The same config and the same thresholds as
      # `bun run test:coverage` at a checkout — the merge replays every shard's
      # results (and their annotations) and applies the thresholds to the
      # merged coverage — with only the reporter set narrowed: nothing in CI
      # reads the ~550-file html tree, the clover XML or the text table; the
      # only consumer is "Parse coverage" below, which reads
      # coverage-summary.json.
      - name: Test
        id: suite
        run: bun run test:coverage:merge

      # Always parse coverage so the PR comment can show numbers even on failure.
      - name: Parse coverage
        id: coverage
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total;
              const w = (k,v) => require('fs').appendFileSync(process.env.GITHUB_OUTPUT, k+'='+v+'\n');
              w('found','true');
              w('statements',s.statements.pct);
              w('branches',s.branches.pct);
              w('functions',s.functions.pct);
              w('lines',s.lines.pct);
              // The text table no longer prints in CI, so leave the totals in the log.
              console.log('coverage: statements '+s.statements.pct+'%, branches '+s.branches.pct+'%, functions '+s.functions.pct+'%, lines '+s.lines.pct+'%');
            "
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # The jobs this one reports for. The merged suite can pass while a
      # blocking check in `checks` failed, and a shard can fail without the
      # merge ever running; either way this required check is the one that
      # has to say so.
      - name: The checks and every shard passed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          rc=0
          if [ "$CHECKS_RESULT" != "success" ]; then
            echo "::error::the checks job finished '$CHECKS_RESULT' — see its log"
            rc=1
          fi
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::the vitest shards finished '$SHARD_RESULT' — see the vitest (n/4) jobs"
            rc=1
          fi
          exit "$rc"

  comment:
    # Skip for fork PRs: GITHUB_TOKEN is always read-only on fork PRs regardless
    # of repo/workflow permissions, so the comment would 403. Native PR checks
    # UI already shows the same status.
    #
    # `always()` is load-bearing, not decoration. A job whose `if:` contains no
    # status-check function gets the implicit `success()`, so this one was
    # SKIPPED on every run where `test` failed — verified on runs 33967347945,
    # 33968019417 and 33939067430, all `test -> failure, comment -> skipped`.
    # The comment is edited in place under one marker, so the Tests section then
    # kept whatever it last said: PR #645 was showing "✅ Tests — Result: passed"
    # over a red run for a day. The only sentence this job had ever been able to
    # render was "passed". e2e-install.yml already writes it this way.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && always() }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Comment PR
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SUITE_OUTCOME: ${{ needs.test.outputs.suite }}
          COVERAGE_FOUND: ${{ needs.test.outputs.found }}
          COVERAGE_STATEMENTS: ${{ needs.test.outputs.statements }}
          COVERAGE_BRANCHES: ${{ needs.test.outputs.branches }}
          COVERAGE_FUNCTIONS: ${{ needs.test.outputs.functions }}
          COVERAGE_LINES: ${{ needs.test.outputs.lines }}
        with:
          script: |
            const marker = '<!-- clawbox-ci-summary -->';
            const testsStart = '<!-- clawbox-ci-tests:start -->';
            const testsEnd = '<!-- clawbox-ci-tests:end -->';
            const e2eStart = '<!-- clawbox-ci-e2e:start -->';
            const e2eEnd = '<!-- clawbox-ci-e2e:end -->';
            // TWO claims, two sources, kept apart. "Tests passed/failed" is
            // about the SUITE and may only come from the suite's own step
            // outcome; the JOB's result is a different fact and gets its own
            // line. Mixing them reports a suite that never ran whole as
            // "failed" (a shard never reported) and a suite that passed as
            // "failed" (a check beside it, such as the MCP typecheck, went red)
            // — false failures in both directions, over the one sentence a
            // reviewer actually reads.
            const suite = process.env.SUITE_OUTCOME;
            const passed = suite === 'success';
            const failed = suite === 'failure';
            const icon = passed ? '✅' : failed ? '❌' : '⚠️';
            const verdict = passed ? 'passed' : failed ? 'failed' : 'did not run';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let section = `## ${icon} Tests\n- Result: **${verdict}**\n- [View run](${runUrl})`;
            if (!passed && !failed) {
              // Deliberately not a list of step or job names: a shard can fail
              // to report at checkout, setup-bun or `bun install` as easily as
              // in vitest, and naming one sends a reader with a lockfile
              // mismatch to a log that never ran.
              section += `\n- The suite did not report: a shard never finished, a step before the merge failed, or the run was cancelled. See the run.`;
            } else if (process.env.TEST_RESULT === 'cancelled') {
              // The same false failure the E2E verdicts carried, one line
              // further in: `always()` reaches this job during a cancellation
              // too, and a suite that reported before the run was stopped would
              // otherwise be told as "a check beside it failed".
              //
              // It names the verdict rather than assuming "passed": the suite
              // going red is the most likely reason anyone cancels this
              // workflow, so failure × cancelled is the square this sentence
              // is most often read in.
              section += `\n- The suite ${verdict}, then the run was cancelled. See the run.`;
            } else if (passed && process.env.TEST_RESULT !== 'success') {
              // Only when the SUITE passed. Over a failed suite the job's own
              // failure is not news, and "even though the suite did" would be
              // a second, contradictory claim beside "Result: failed".
              section += `\n- The job did not pass even though the suite did — a check beside it failed. See the run.`;
            }
            if (process.env.COVERAGE_FOUND === 'true') {
              section += `\n- Coverage: statements **${process.env.COVERAGE_STATEMENTS}%**, branches **${process.env.COVERAGE_BRANCHES}%**, functions **${process.env.COVERAGE_FUNCTIONS}%**, lines **${process.env.COVERAGE_LINES}%**`;
            }
            const wrappedSection = `${testsStart}\n${section}\n${testsEnd}`;
            const defaultBody = `${marker}\n# CI Summary\n\n${wrappedSection}\n\n${e2eStart}\n## ⏳ E2E\n- Waiting for E2E workflow to finish.\n${e2eEnd}`;

            const {owner, repo} = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: context.issue.number, per_page: 100});
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            const updateSection = (body, start, end, replacement) => {
              const pattern = new RegExp(`${start}[\\s\\S]*?${end}`);
              return pattern.test(body) ? body.replace(pattern, replacement) : `${body}\n\n${replacement}`;
            };

            const body = existing
              ? updateSection(existing.body, testsStart, testsEnd, wrappedSection)
              : defaultBody;

            if (existing) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number: context.issue.number, body});
