name: "CodeQL"

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  schedule:
    # Weekly full scan (Mondays 02:30 UTC) to catch advisories in code that
    # hasn't changed since the last push.
    - cron: "30 2 * * 1"

permissions:
  contents: read

# A run a newer push to the same PR has superseded tells nobody anything the
# newer one will not, and it holds a runner the newer one may be queued behind. Grouped by PR number,
# and every other run — a push to a branch, a schedule — in a group of its
# own (its run id): GitHub keeps one RUNNING and one PENDING run per group and
# cancels the pending one when a third arrives, whatever `cancel-in-progress`
# says, so a group keyed on the branch would queue each landed commit behind
# the last and drop the middle one of three quick pushes unverified.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required to upload results to the code-scanning dashboard.
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # JS + TS share one analysis; build-mode "none" needs no compile step.
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Config file carries the security-extended query suite plus
          # paths-ignore for test code (runtime scripts stay scanned).
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
