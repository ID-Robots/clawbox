# Dependabot config. Posture: no version PRs; security is triaged by hand.
#
# Version-update PRs are switched off for every ecosystem: each entry below
# sets `open-pull-requests-limit: 0`. The team takes only urgent and security
# updates, and takes them by hand. Minor and patch PRs were too much churn for
# too little value; the grouped monthly MAJOR PRs that replaced them are off
# now too.
#
# Security alerts are triaged by hand onto beta. Dependabot alerts stay
# enabled. Dependabot SECURITY UPDATE PRs stay disabled in repository
# Settings > Code security: GitHub always targets them at the default branch
# and ignores target-branch, which would bypass beta. Instead
# .github/workflows/dependency-audit.yml audits bun.lock weekly and keeps one
# tracking issue open while a vulnerable package is present; the fix lands
# as a tested PR to beta.
#
# The groups and ignore rules below stay so that raising a limit brings back
# one grouped majors-only PR, not a PR per minor/patch. The `update-types`
# ignore rules only affect VERSION updates, never security updates (GitHub
# docs, dependabot.yml options reference, `ignore` > `update-types`). A
# `dependency-name` ignore without update-types, like the @novnc/novnc one,
# does also block security updates for that package.
#
# Keep package-lock.json synchronized for the dependency graph, and validate
# the authoritative bun.lock with bun install --frozen-lockfile before a PR.
version: 2
updates:
  # bun-managed app. bun.lock is authoritative (CI runs
  # `bun install --frozen-lockfile`). No version PRs (limit 0); if the limit
  # is raised: monthly, majors only, one grouped PR.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "beta"
    open-pull-requests-limit: 0
    groups:
      majors:
        update-types: ["major"]
    ignore:
      # No minor/patch version PRs (security fixes are unaffected, see above).
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # @novnc/novnc stays pinned at exactly 1.6.0 — ignore ALL its updates.
      # 1.7.0 is a breaking change wearing a minor version number: it drops
      # lib/ for core/ and declares `"exports": "./core/rfb.js"` as a bare
      # string, so EVERY subpath import is refused — including the keysymdef
      # one src/lib/vnc-keys.ts needs. There is no drop-in rewrite, so the
      # manifest pins 1.6.0 (src/tests/unit/novnc-pin.test.ts guards it), and
      # any automated bump, major included, could only ever fail. Remove this
      # when upstream restores subpath exports — then take the bump by hand.
      - dependency-name: "@novnc/novnc"

  # Disable duplicate npm version PRs. This does NOT disable security PRs;
  # the repository setting above does. Keep an explicit beta target so this
  # entry cannot send version updates to main if its limit is later raised.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "beta"
    open-pull-requests-limit: 0

  # GitHub Actions pins (checkout, setup-node, gh-pages, …). No version PRs
  # (limit 0); if the limit is raised: majors only, one grouped monthly PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "beta"
    open-pull-requests-limit: 0
    groups:
      majors:
        update-types: ["major"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
