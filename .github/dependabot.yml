# Dependabot config. Posture: security-first, low-churn.
#
# All dependency changes are reviewed and tested on beta before release.
# Keep Dependabot alerts enabled, but automatic SECURITY UPDATE PRs disabled
# in repository Settings > Code security: GitHub always targets those at the
# default branch and ignores target-branch. The setting is repository-owned,
# not controlled by this YAML. Triage alerts into tested beta fixes instead.
# Scheduled Bun/Actions version PRs below target beta; majors stay opt-in.
# Keep package-lock.json synchronized for the dependency graph, and validate
# the authoritative bun.lock with bun install --frozen-lockfile before a PR.
version: 2
updates:
  # Version updates for the bun-managed app. bun.lock is authoritative
  # (CI runs `bun install --frozen-lockfile`). Weekly, grouped, minor+patch only.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "beta"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Majors are opt-in — do them by hand, not on Dependabot's schedule.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @novnc/novnc 1.7.0 is a breaking change wearing a minor version number:
      # it drops lib/ for core/ and declares `"exports": "./core/rfb.js"` as a
      # bare string, so EVERY subpath import is refused — including the
      # keysymdef one src/lib/vnc-keys.ts needs. There is no drop-in rewrite,
      # so the manifest pins 1.6.0 exactly (src/tests/unit/novnc-pin.test.ts
      # guards it). Without this rule the weekly run rewrites that pin and
      # opens a PR that can only ever fail. Remove this when upstream restores
      # subpath exports — then take the bump by hand.
      - dependency-name: "@novnc/novnc"
        update-types: ["version-update:semver-minor"]

  # Disable duplicate npm version PRs. This does NOT disable security PRs;
  # the repository setting above does. Keep an explicit beta target so this
  # entry cannot send version updates to main if its limit is later raised.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "beta"
    open-pull-requests-limit: 0

  # GitHub Actions pins (checkout, setup-node, gh-pages, …). Minor+patch only;
  # action majors are opt-in for the same reason as above.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    target-branch: "beta"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
