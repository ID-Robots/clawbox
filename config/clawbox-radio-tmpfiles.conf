# Installed by install.sh::install_radio_tmpfiles to
# /etc/tmpfiles.d/clawbox-radio.conf (root:root 0644).
#
# The radio ownership directory scripts/wifi-radio.sh locks under. /run is a
# tmpfs: nothing outlives a reboot, and until a ROOT radio script (start-ap.sh,
# the AP watchdog, wifi-failover.sh) ran, neither the directory nor the lock in
# it existed. The web account (user clawbox) calls stop-ap.sh and
# `wifi-radio.sh --nmcli` too and cannot create anything under /run, so on a box
# where no root script had run yet (Ethernet-only, hotspot switched off, a lab
# board) every WiFi connect failed on "Command failed: bash .../stop-ap.sh".
#
# Same owner and mode wifi_lock insists on for root (uid 0, 0755): the web
# account may open the lock to take it, never replace it or write beside it.
d /run/clawbox-radio 0755 root root -
# The lock for the default interface (NETWORK_INTERFACE defaults to it). Another
# interface's lock is made by the first root script that runs for it.
f /run/clawbox-radio/wlP1p1s0.lock 0644 root root -
